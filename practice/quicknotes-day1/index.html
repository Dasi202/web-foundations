<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Capture ideas before they disappear</p>
    </header>

    <main>
        <section>
            <h2>Add a note</h2>
            <form id="note-form">
                <label for="note-input">New note</label>
                <input type="text" id="note-input" placeholder="Type a note...">
                <button type="submit">Add Note</button>
            </form>
        </section>

        <section>
            <h2>My Notes</h2>
            <ul id="notes-list">
                <li class="note">Revise HTML forms</li>
                <li class="note">Push my code to github</li>
            </ul>
        </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes.Built during Web Foundations,</p>
    </footer>
  </body>
</html>
